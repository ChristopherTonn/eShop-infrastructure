apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-webapp
  namespace: default
  labels:
    app: eshop-webapp
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eshop-webapp
  template:
    metadata:
      labels:
        app: eshop-webapp
        component: frontend
    spec:
      containers:
        - name: eshop-webapp
          image: 333917886778.dkr.ecr.eu-central-1.amazonaws.com/eshop-webapp:linux
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: eshop-webapp-service
  namespace: default
  labels:
    app: eshop-webapp
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: eshop-webapp

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-config
  namespace: default
data:
  app.name: "eShop Demo"
  app.version: "1.0.0"
  deployment.environment: "AWS EKS"
  infrastructure.status: "✅ Deployed Successfully"
