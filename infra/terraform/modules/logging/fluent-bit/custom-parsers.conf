[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name        dotnet
    Format      regex
    Regex       ^\[(?<timestamp>[^\]]+)\] (?<severity>\w+) \[(?<source>[^\]]+)\] (?<message>.+)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%f

[PARSER]
    Name        dotnet_json
    Format      json
    Time_Key    Timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z

[PARSER]
    Name        rabbitmq
    Format      regex
    Regex       ^(?<timestamp>[^ ]+ [^ ]+) \[(?<severity>[^\]]+)\] (?<source>[^ ]+) <(?<pid>[^>]+)> (?<message>.+)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%f

[PARSER]
    Name        postgres
    Format      regex
    Regex       (?<timestamp>[^ ]+ [^ ]+ [^ ]+) \[(?<pid>[^\]]+)\] (?<user>[^ ]*) (?<database>[^ ]*) (?<message>.+)$
    Time_Key    timestamp
    Time_Format %Y-%m-%d %H:%M:%S.%f %Z

[MULTILINE_PARSER]
    Name                multiline-dotnet
    Flush_timeout       1000
    Rule                "start_state" "/^\[/" "cont"
    Rule                "cont" "/^  |^$/" "cont"

[MULTILINE_PARSER]
    Name                multiline-exception
    Flush_timeout       1000
    Rule                "start_state" "/\s*(Exception|Error|at\s)/" "cont"
    Rule                "cont" "/^  |^   at |^\s*\+/" "cont"
