image:
  repository: ${image_repository}
  tag: ${image_tag}
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: ${service_account}
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/ROLE_NAME"

rbac:
  create: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2020"
  prometheus.io/path: "/api/v1/metrics/prometheus"

podSecurityContext:
  runAsUser: 0
  fsGroup: 0

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - DAC_OVERRIDE
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: ${cpu_requests}
    memory: ${memory_requests}
  limits:
    cpu: ${cpu_limits}
    memory: ${memory_limits}

volumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true
  - name: custom-parsers
    mountPath: /fluent-bit/etc/custom-parsers.conf
    subPath: custom-parsers.conf
    readOnly: true

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
  - name: custom-parsers
    configMap:
      name: fluent-bit-custom-parsers

config:
  service: |
    [SERVICE]
        Flush                 5
        Log_Level             info
        Daemon                off
        HTTP_Server           On
        HTTP_Listen           0.0.0.0
        HTTP_Port             2020
        Parsers_File          parsers.conf
        Parsers_File          custom-parsers.conf
        storage.path          /var/log/flb-storage/
        storage.sync          normal
        storage.backlog.mem_limit  5M
        storage.metrics       on

  inputs: |
    [INPUT]
        Name                systemd
        Tag                 systemd.*
        Path                /var/log/journal
        Read_From_Tail      On
        Strip_Underscores   On

    [INPUT]
        Name                tail
        Tag                 container.*
        Path                /var/log/containers/*.log
        Parser              docker
        DB                  /var/log/flb-db.db
        Mem_Buf_Limit       ${buffer_size}
        Skip_Long_Lines     On
        Refresh_Interval    10
        Rotate_Wait         30
        Read_From_Head      Off

  filters: |
    [FILTER]
        Name                kubernetes
        Match               container.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     container.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         On

    [FILTER]
        Name                nest
        Match               container.*
        Operation           lift
        Nested_under        kubernetes
        Add_prefix          k8s_

    [FILTER]
        Name                modify
        Match               container.*
        Add                 cluster_name ${cluster_name}
        Add                 region ${region}
        Add                 environment production
        Add                 log_group_prefix ${log_group_prefix}

  outputs: |
    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*basket*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/basket-api
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*catalog*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/catalog-api
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*ordering*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/ordering-api
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*identity*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/identity-api
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*webhooks*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/webhooks-api
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*order-processor*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/order-processor
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*payment*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/payment-processor
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               container.var.log.containers.*webapp*.log
        region              ${region}
        log_group_name      ${log_group_prefix}/webapp
        log_stream_prefix   from-fluent-bit-
        auto_create_group   true
        retry_limit         2

    [OUTPUT]
        Name                cloudwatch_logs
        Match               systemd.*
        region              ${region}
        log_group_name      ${log_group_prefix}/platform
        log_stream_prefix   systemd-
        auto_create_group   true
        retry_limit         2

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

priorityClassName: system-cluster-critical

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: eks.amazonaws.com/compute-type
              operator: In
              values:
                - ec2
                - on-demand
