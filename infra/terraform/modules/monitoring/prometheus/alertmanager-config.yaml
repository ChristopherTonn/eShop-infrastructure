# ============================================================================
# Alertmanager Configuration - Secret
# ============================================================================
# Alertmanager configuration with routing rules and notification channels
# This is a basic configuration template that can be customized

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/managed-by: terraform
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      slack_api_url: '${SLACK_WEBHOOK_URL}'

    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - match:
            severity: critical
          receiver: 'critical'
          continue: true
          group_wait: 10s
          repeat_interval: 1h

        - match:
            severity: warning
          receiver: 'warning'
          group_wait: 1m
          repeat_interval: 4h

    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'http://localhost:5001/'

      - name: 'critical'
        slack_configs:
          - channel: '#alerts-critical'
            title: 'Critical Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            send_resolved: true

      - name: 'warning'
        slack_configs:
          - channel: '#alerts-warning'
            title: 'Warning Alert'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'dev', 'instance']
