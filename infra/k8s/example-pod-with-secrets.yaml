apiVersion: v1
kind: Pod
metadata:
  name: basket-api
  namespace: eshop-dev
spec:
  serviceAccountName: eshop-services
  containers:
  - name: basket-api
    image: <ECR_REGISTRY>/basket-api:latest
    ports:
    - containerPort: 5153
    env:
    - name: ASPNETCORE_ENVIRONMENT
      value: "Development"
    - name: ASPNETCORE_URLS
      value: "http://+:5153"
    
    # Database connection from Secret
    - name: ConnectionStrings__BasketDB
      valueFrom:
        secretKeyRef:
          name: db-connection-string
          key: connection-string
    
    # Redis connection
    - name: ConnectionStrings__Redis
      valueFrom:
        secretKeyRef:
          name: redis-connection-string
          key: connection-string
    
    # Mount CSI driver volumes
    volumeMounts:
    - name: rds-secrets
      mountPath: /mnt/secrets/rds
      readOnly: true
    - name: redis-secrets
      mountPath: /mnt/secrets/redis
      readOnly: true
    
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    livenessProbe:
      httpGet:
        path: /health
        port: 5153
      initialDelaySeconds: 30
      periodSeconds: 10
    
    readinessProbe:
      httpGet:
        path: /ready
        port: 5153
      initialDelaySeconds: 10
      periodSeconds: 5

  volumes:
  # Secrets from AWS Secrets Manager via CSI driver
  - name: rds-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "eshop-rds-secrets"
  
  - name: redis-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "eshop-redis-secrets"
---
# ============================================================================
# ServiceAccount für eShop Services
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eshop-services
  namespace: eshop-dev
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/eshop-dev-services
