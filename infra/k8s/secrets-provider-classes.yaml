apiVersion: v1
kind: Namespace
metadata:
  name: eshop-dev
---
# ============================================================================
# SecretProviderClass für Database Credentials
# ============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eshop-rds-secrets
  namespace: eshop-dev
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eshop-dev/rds/credentials"
        objectType: "secretsmanager"
        objectAlias: "db-credentials"
---
# ============================================================================
# SecretProviderClass für Redis/ElastiCache
# ============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eshop-redis-secrets
  namespace: eshop-dev
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eshop-dev/redis/credentials"
        objectType: "secretsmanager"
        objectAlias: "redis-password"
---
# ============================================================================
# SecretProviderClass für Identity API JWT Secret
# ============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eshop-jwt-secrets
  namespace: eshop-dev
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eshop-dev/identity/jwt-secret"
        objectType: "secretsmanager"
        objectAlias: "jwt-signing-secret"
---
# ============================================================================
# SecretProviderClass für RabbitMQ
# ============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eshop-rabbitmq-secrets
  namespace: eshop-dev
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eshop-dev/rabbitmq/credentials"
        objectType: "secretsmanager"
        objectAlias: "rabbitmq-credentials"
  # Optional: Sync Kubernetes Secret
  secretObjects:
  - secretKey: username
    secretName: rabbitmq-credentials
    data:
    - objectName: rabbitmq-credentials
      key: username
  - secretKey: password
    secretName: rabbitmq-credentials
    data:
    - objectName: rabbitmq-credentials
      key: password
---
# ============================================================================
# SecretProviderClass für API Keys
# ============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eshop-api-keys-secrets
  namespace: eshop-dev
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eshop-dev/api-keys"
        objectType: "secretsmanager"
        objectAlias: "api-keys"
  # Sync as Kubernetes Secret
  secretObjects:
  - secretKey: api-keys
    secretName: external-api-keys
    data:
    - objectName: api-keys
      key: api-keys
