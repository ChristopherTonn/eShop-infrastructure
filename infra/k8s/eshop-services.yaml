---
# ============================================================================
# Job: Order Processor (Background Processing)
# ============================================================================
apiVersion: batch/v1
kind: Deployment
metadata:
  name: order-processor
  namespace: eshop-services
  labels:
    app: order-processor
    component: background-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
        component: background-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5014"
    spec:
      serviceAccountName: eshop-services
      containers:
        - name: order-processor
          image: $DOCKER_REGISTRY/eshop-order-processor:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: eshop-config
            - secretRef:
                name: eshop-secrets
          env:
            - name: SERVICE_NAME
              value: "OrderProcessor"
            - name: WORKER_TYPE
              value: "OrderProcessing"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/healthy
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false

