# ============================================================================
# eShop Microservices - Complete Kubernetes Deployment
# CTO-Level Production Setup with all eShop Services
# ============================================================================

---
# ============================================================================
# Namespace
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: eshop-services
  labels:
    app: eshop

---
# ============================================================================
# ConfigMaps - Application Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-config
  namespace: eshop-services
data:
  # Database Configuration
  DB_HOST: "eshop-rds-instance.c9akciq32.eu-central-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "eshop"
  DB_USER: "postgres"

  # Redis Cache Configuration
  REDIS_HOST: "eshop-elasticache.xxx.cache.amazonaws.com"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # RabbitMQ Configuration
  RABBITMQ_HOST: "rabbitmq-headless.rabbitmq.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "guest"
  RABBITMQ_VHOST: "/"

  # Service URLs (Internal Service Discovery)
  IDENTITY_URL: "http://identity-api:5001"
  CATALOG_URL: "http://catalog-api:5010"
  BASKET_URL: "http://basket-api:5011"
  ORDERING_URL: "http://ordering-api:5012"
  WEBHOOKS_URL: "http://webhooks-api:5013"

  # Logging & Monitoring
  LOG_LEVEL: "Information"
  ASPNETCORE_ENVIRONMENT: "Production"

---
# ============================================================================
# Secrets - Sensitive Data (from AWS Secrets Manager via CSI Driver)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: eshop-secrets
  namespace: eshop-services
type: Opaque
stringData:
  DB_PASSWORD: "DevPassword123!@#" # Should come from Secrets Manager in prod
  RABBITMQ_PASSWORD: "DevRabbitPassword123!@#"
  JWT_SECRET: "dev-jwt-signing-secret-key-min-32-chars-required-long-string"
  REDIS_PASSWORD: "DevRedisAuth123!@#Dev"

---
# ============================================================================
# Service: Identity API
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: eshop-services
  labels:
    app: identity-api
spec:
  type: ClusterIP
  selector:
    app: identity-api
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
      name: http

---
# Deployment: Identity API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: eshop-services
  labels:
    app: identity-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: eshop-services
      containers:
        - name: identity-api
          image: $DOCKER_REGISTRY/eshop-identity:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: eshop-config
            - secretRef:
                name: eshop-secrets
          env:
            - name: SERVICE_NAME
              value: "Identity.API"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false

