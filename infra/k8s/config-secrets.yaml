apiVersion: v1
kind: ConfigMap
metadata:
  name: eshop-config
  namespace: eshop
data:
  # Identity Service Configuration
  jwt-issuer: "https://identity.eshop.local"
  jwt-audience: "eshop-webapp"
  
  # Service URLs (internal cluster DNS)
  identity-base-url: "http://identity-api.eshop.svc.cluster.local/identity"
  basket-api-url: "http://basket-api.eshop.svc.cluster.local"
  catalog-api-url: "http://catalog-api.eshop.svc.cluster.local"
  ordering-api-url: "http://ordering-api.eshop.svc.cluster.local"
  webhooks-api-url: "http://webhooks-api.eshop.svc.cluster.local"
  
  # Logging
  LOG_LEVEL: "Information"
---
apiVersion: v1
kind: Secret
metadata:
  name: eshop-secrets
  namespace: eshop
type: Opaque
stringData:
  # Database Connections (PostgreSQL)
  postgres-catalog-connection: "Host=postgres.eshop.svc.cluster.local;Port=5432;Database=catalogdb;Username=postgres;Password=CHANGE_ME"
  postgres-identity-connection: "Host=postgres.eshop.svc.cluster.local;Port=5432;Database=identitydb;Username=postgres;Password=CHANGE_ME"
  postgres-order-connection: "Host=postgres.eshop.svc.cluster.local;Port=5432;Database=orderdb;Username=postgres;Password=CHANGE_ME"
  postgres-webhooks-connection: "Host=postgres.eshop.svc.cluster.local;Port=5432;Database=webhooksdb;Username=postgres;Password=CHANGE_ME"
  postgres-integrationeventlog-connection: "Host=postgres.eshop.svc.cluster.local;Port=5432;Database=integrationeventlogdb;Username=postgres;Password=CHANGE_ME"
  
  # Redis
  redis-connection-string: "redis.eshop.svc.cluster.local:6379"
  
  # RabbitMQ
  rabbitmq-host: "rabbitmq.eshop.svc.cluster.local"
  rabbitmq-username: "guest"
  rabbitmq-password: "guest"
  
  # JWT
  jwt-secret: "CHANGE_ME_WITH_SECURE_SECRET_KEY_AT_LEAST_32_CHARACTERS"
  
  # Payment Provider (Stripe)
  stripe-api-key: "sk_test_CHANGE_ME"
