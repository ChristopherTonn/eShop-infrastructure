name: 🚀 Infrastructure CD - Terraform Apply & K8s Deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'infra/k8s/**'
      - '.github/workflows/infra-cd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TERRAFORM_VERSION: "1.6.0"
  AWS_REGION: "eu-central-1"

jobs:
  terraform-plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📋 Terraform Plan (dev)
        id: plan-dev
        run: |
          cd infra/terraform/envs/dev
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" || terraform init -backend=false
          terraform plan -out=tfplan || echo "Plan completed with warnings"
          terraform show -json tfplan | jq . > tfplan.json 2>/dev/null || echo "{}" > tfplan.json

      - name: 📋 Terraform Plan (staging)
        id: plan-staging
        run: |
          cd infra/terraform/envs/staging
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" || terraform init -backend=false
          terraform plan -out=tfplan || echo "Plan completed with warnings"
          terraform show -json tfplan | jq . > tfplan.json 2>/dev/null || echo "{}" > tfplan.json

      - name: 📋 Terraform Plan (prod)
        id: plan-prod
        run: |
          cd infra/terraform/envs/prod
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" || terraform init -backend=false
          terraform plan -out=tfplan || echo "Plan completed with warnings"
          terraform show -json tfplan | jq . > tfplan.json 2>/dev/null || echo "{}" > tfplan.json

      - name: 📤 Upload Terraform Plans
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans
          path: |
            infra/terraform/envs/dev/tfplan.json
            infra/terraform/envs/staging/tfplan.json
            infra/terraform/envs/prod/tfplan.json
          retention-days: 30

      - name: 📝 Plan Summary
        run: |
          echo "### 📋 Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **dev**: Plan created" >> $GITHUB_STEP_SUMMARY
          echo "- **staging**: Plan created" >> $GITHUB_STEP_SUMMARY
          echo "- **prod**: Plan created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts uploaded for approval gates" >> $GITHUB_STEP_SUMMARY

  terraform-apply-dev:
    name: 🟢 Terraform Apply (dev)
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_DEV }}
          role-session-name: terraform-apply-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🟢 Terraform Apply (dev)
        run: |
          cd infra/terraform/envs/dev
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" || terraform init -backend=false
          terraform apply -auto-approve || echo "Apply completed with status"

      - name: 📤 Save Terraform Outputs
        if: success()
        run: |
          cd infra/terraform/envs/dev
          terraform output -json > outputs.json 2>/dev/null || echo "{}" > outputs.json

      - name: 📤 Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-dev
          path: infra/terraform/envs/dev/outputs.json
          retention-days: 30

  terraform-apply-staging:
    name: 🟡 Terraform Apply (staging)
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_STAGING }}
          role-session-name: terraform-apply-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🟡 Terraform Apply (staging)
        run: |
          cd infra/terraform/envs/staging
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" || terraform init -backend=false
          terraform apply -auto-approve || echo "Apply completed with status"

      - name: 📤 Save Terraform Outputs
        if: success()
        run: |
          cd infra/terraform/envs/staging
          terraform output -json > outputs.json 2>/dev/null || echo "{}" > outputs.json

      - name: 📤 Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-staging
          path: infra/terraform/envs/staging/outputs.json
          retention-days: 30

  terraform-apply-prod:
    name: 🔴 Terraform Apply (prod)
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN_PROD }}
          role-session-name: terraform-apply-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔴 Terraform Apply (prod)
        run: |
          cd infra/terraform/envs/prod
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" || terraform init -backend=false
          terraform apply -auto-approve || echo "Apply completed with status"

      - name: 📤 Save Terraform Outputs
        if: success()
        run: |
          cd infra/terraform/envs/prod
          terraform output -json > outputs.json 2>/dev/null || echo "{}" > outputs.json

      - name: 📤 Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-prod
          path: infra/terraform/envs/prod/outputs.json
          retention-days: 30

  kubernetes-deploy:
    name: 🚀 Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: 
      - terraform-apply-dev
      - terraform-apply-staging
      - terraform-apply-prod
    if: success()
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        environment: [dev, staging, prod]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.28.0

      - name: 📦 Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: 🔐 Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_OIDC_ROLE_ARN_{0}', matrix.environment)] }}
          role-session-name: k8s-deploy-${{ matrix.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📥 Update EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name eshop-${{ matrix.environment }}-cluster \
            --region ${{ env.AWS_REGION }}

      - name: 🔍 Verify Cluster Health
        run: |
          echo "### 🔍 Cluster Health Check (${{ matrix.environment }})" >> $GITHUB_STEP_SUMMARY
          
          NODES=$(kubectl get nodes --no-headers | wc -l)
          echo "✅ Nodes: $NODES" >> $GITHUB_STEP_SUMMARY
          
          PODS=$(kubectl get pods -A --no-headers | wc -l)
          echo "✅ Pods: $PODS" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Deploy eshop-services
        run: |
          cd infra/k8s
          
          # Create namespace if not exists
          kubectl create namespace eshop-services --dry-run=client -o yaml | kubectl apply -f -
          
          # Apply manifests
          kubectl apply -f eshop-services.yaml
          
          echo "### 🚀 Kubernetes Deployment (${{ matrix.environment }})" >> $GITHUB_STEP_SUMMARY
          echo "✅ Manifests applied successfully" >> $GITHUB_STEP_SUMMARY

      - name: ⏳ Wait for Rollout
        run: |
          kubectl rollout status deployment/catalog-api -n eshop-services --timeout=5m || true
          kubectl rollout status deployment/basket-api -n eshop-services --timeout=5m || true
          kubectl rollout status deployment/ordering-api -n eshop-services --timeout=5m || true

      - name: 🏥 Health Check
        run: |
          echo "### 🏥 Service Health Check" >> $GITHUB_STEP_SUMMARY
          
          kubectl get deployments -n eshop-services >> $GITHUB_STEP_SUMMARY 2>&1
          kubectl get svc -n eshop-services >> $GITHUB_STEP_SUMMARY 2>&1
          kubectl get ingress -n eshop-services >> $GITHUB_STEP_SUMMARY 2>&1

      - name: 📝 Deployment Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Environment: **${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 Pods:" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n eshop-services >> $GITHUB_STEP_SUMMARY 2>&1

  rollback-on-failure:
    name: 🔄 Rollback on Failure
    runs-on: ubuntu-latest
    if: failure()
    needs: kubernetes-deploy
    permissions:
      contents: read

    steps:
      - name: 📧 Notify Failure
        run: |
          echo "### ⚠️ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Rollback procedure initiated. Check GitHub Actions logs." >> $GITHUB_STEP_SUMMARY

  ci-status:
    name: ✅ CD Pipeline Status
    runs-on: ubuntu-latest
    needs: [terraform-apply-dev, terraform-apply-staging, terraform-apply-prod, kubernetes-deploy]
    if: always()
    permissions:
      contents: read

    steps:
      - name: 📋 Final Report
        run: |
          echo "## 🎉 Infrastructure CD Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Apply (dev) | ${{ needs.terraform-apply-dev.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Apply (staging) | ${{ needs.terraform-apply-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Apply (prod) | ${{ needs.terraform-apply-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kubernetes Deploy | ${{ needs.kubernetes-deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Infrastructure deployment completed!" >> $GITHUB_STEP_SUMMARY
