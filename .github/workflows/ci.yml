name: 🔨 Continuous Integration

on:
  push:
    branches: [develop, staging, main, feature/ci-cd-implementation]
  pull_request:
    branches: [develop, staging, main]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CONFIGURATION: "Release"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: 🏗️ Build & Test .NET Services
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - eShop.AppHost
          - Basket.API
          - Catalog.API
          - Identity.API
          - Ordering.API
          - OrderProcessor
          - PaymentProcessor
          - Webhooks.API
          - WebApp
          - WebhookClient
          - eShop.ServiceDefaults
          - WebAppComponents

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          include-prerelease: true

      - name: 📦 Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuget-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🔄 Restore Dependencies
        run: dotnet restore src/${{ matrix.service }}/${{ matrix.service }}.csproj
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-cache

      - name: 🏗️ Build Service
        run: dotnet build src/${{ matrix.service }}/${{ matrix.service }}.csproj --no-restore --configuration ${{ env.DOTNET_CONFIGURATION }}

      - name: 🧪 Run Unit Tests
        run: |
          if [ -d "tests" ]; then
            TEST_PROJECT=$(find tests -name "*$(basename ${{ matrix.service }})*.csproj" | head -1)
            if [ -n "$TEST_PROJECT" ]; then
              echo "Running tests for: $TEST_PROJECT"
              dotnet test "$TEST_PROJECT" --no-build --configuration ${{ env.DOTNET_CONFIGURATION }} --verbosity normal --logger trx --results-directory TestResults/
            else
              echo "No test project found for ${{ matrix.service }}"
            fi
          else
            echo "No tests directory found"
          fi

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.service }}
          path: TestResults/*.trx
          retention-days: 7

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: 📤 Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: 📋 Generate Security Report
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Trivy security scan completed for commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Scan results uploaded to GitHub Security tab." >> $GITHUB_STEP_SUMMARY

  build-solution:
    name: 🏢 Build Complete Solution
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          include-prerelease: true

      - name: 📦 Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuget-cache
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 🔄 Restore Solution
        run: dotnet restore eShop.Web.slnf
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/nuget-cache

      - name: 🏗️ Build Solution
        run: dotnet build eShop.Web.slnf --no-restore --configuration ${{ env.DOTNET_CONFIGURATION }}

      - name: 📦 Publish Applications
        run: |
          mkdir -p artifacts

          # Publish each service
          services=(
            "src/Basket.API"
            "src/Catalog.API" 
            "src/Identity.API"
            "src/Ordering.API"
            "src/OrderProcessor"
            "src/PaymentProcessor"
            "src/Webhooks.API"
            "src/WebApp"
            "src/WebhookClient"
          )

          for service in "${services[@]}"; do
            service_name=$(basename "$service")
            echo "Publishing $service_name..."
            dotnet publish "$service/$service_name.csproj" \
              --no-restore \
              --configuration ${{ env.DOTNET_CONFIGURATION }} \
              --output "artifacts/$service_name" \
              --verbosity minimal
          done

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          compression-level: 6

      - name: 📋 Build Summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Solution built successfully" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts published for commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "🌟 Ready for deployment to staging/production" >> $GITHUB_STEP_SUMMARY

          echo "### 📊 Build Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration:** ${{ env.DOTNET_CONFIGURATION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime:** ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Retention:** 30 days" >> $GITHUB_STEP_SUMMARY
