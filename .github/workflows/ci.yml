name: 🔨 Continuous Integration

on:
  push:
    branches: [develop, staging, main, 'feature/**']
  pull_request:
    branches: [develop, staging, main]

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_CONFIGURATION: "Release"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: 🏗️ Build & Test Solution
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          include-prerelease: true

      - name: 📦 Restore Solution
        run: dotnet restore codebase/eShop.Web.slnf

      - name: 🏗️ Build Solution
        run: dotnet build codebase/eShop.Web.slnf --no-restore --configuration ${{ env.DOTNET_CONFIGURATION }} -p:GenerateOpenApiDocuments=false

      - name: 🧪 Run Unit Tests
        run: dotnet test codebase/tests/ --no-build --configuration ${{ env.DOTNET_CONFIGURATION }} --verbosity normal --logger trx --results-directory TestResults/
        continue-on-error: true

      - name: �� Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/
          retention-days: 7

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: 📤 Upload Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: always()

    steps:
      - name: 📋 Report Status
        run: |
          echo "## 🔨 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | $([ '${{ needs.build-and-test.result }}' == 'success' ] && echo '✅' || echo '❌') |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | $([ '${{ needs.security-scan.result }}' == 'success' ] && echo '✅' || echo '⚠️') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ '${{ needs.build-and-test.result }}' == 'success' ]; then
            echo "✅ **Ready for CD Pipeline**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build Failed - See logs above**" >> $GITHUB_STEP_SUMMARY
          fi
