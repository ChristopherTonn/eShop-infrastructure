name: 🏗️ Infrastructure CI - Terraform Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'infra/terraform/**'
      - 'infra/k8s/**'
      - '.github/workflows/infra-ci.yml'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'infra/terraform/**'
      - 'infra/k8s/**'

env:
  TERRAFORM_VERSION: "1.6.0"
  AWS_REGION: "eu-central-1"

jobs:
  terraform-validate:
    name: 🔍 Terraform Validate & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔧 Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: 📋 Terraform Format Check
        run: |
          echo "### 📋 Terraform Format Check" >> $GITHUB_STEP_SUMMARY
          cd infra/terraform
          if terraform fmt -recursive -check .; then
            echo "✅ All Terraform files are properly formatted" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Terraform format issues found. Run: terraform fmt -recursive ." >> $GITHUB_STEP_SUMMARY
            terraform fmt -recursive -diff . >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: ✔️ Terraform Validate (dev)
        run: |
          echo "### ✔️ Terraform Validation Results" >> $GITHUB_STEP_SUMMARY
          cd infra/terraform/envs/dev
          terraform init -backend=false > /dev/null 2>&1
          if terraform validate; then
            echo "✅ **dev** environment - VALID" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **dev** environment - INVALID" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: ✔️ Terraform Validate (staging)
        run: |
          cd infra/terraform/envs/staging
          terraform init -backend=false > /dev/null 2>&1
          terraform validate >> $GITHUB_STEP_SUMMARY 2>&1
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ **staging** environment - VALID" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **staging** environment - INVALID" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: ✔️ Terraform Validate (prod)
        run: |
          cd infra/terraform/envs/prod
          terraform init -backend=false > /dev/null 2>&1
          terraform validate >> $GITHUB_STEP_SUMMARY 2>&1
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ **prod** environment - VALID" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **prod** environment - INVALID" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: 🔗 TFLint Analysis
        working-directory: infra/terraform
        run: |
          echo "### 🔗 TFLint Analysis" >> $GITHUB_STEP_SUMMARY
          tflint --init > /dev/null 2>&1
          tflint --format json > tflint-report.json 2>&1 || true
          
          if [ -s tflint-report.json ] && [ "$(cat tflint-report.json | grep -c 'type')" -gt 0 ]; then
            echo "⚠️ TFLint found issues:" >> $GITHUB_STEP_SUMMARY
            cat tflint-report.json >> $GITHUB_STEP_SUMMARY
            tflint --format default
          else
            echo "✅ No TFLint issues found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload TFLint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tflint-report
          path: infra/terraform/tflint-report.json
          retention-days: 30

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Infrastructure validation passed. Ready for deployment.'
            });

  kubernetes-manifest-validate:
    name: 🚀 Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: ✔️ Validate Kubernetes Manifests
        run: |
          echo "### 🚀 Kubernetes Manifest Validation" >> $GITHUB_STEP_SUMMARY
          
          cd infra/k8s
          for manifest in *.yaml; do
            echo "Validating: $manifest"
            if kubeval "$manifest" --strict; then
              echo "✅ $manifest - VALID" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $manifest - INVALID" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          done
          echo "✅ All Kubernetes manifests are valid" >> $GITHUB_STEP_SUMMARY
